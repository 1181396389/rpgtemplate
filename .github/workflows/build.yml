name: Build Mod JAR (NeoForge 1.21.1)

on:
  push:
    branches: [ neoforge, 'neoforge-*' ]
    tags: [ 'v*-neoforge*' ]
  pull_request:
    branches: [ neoforge, 'neoforge-*' ]
  workflow_dispatch:
    inputs:
      mod_version:
        description: 'Optional override for mod version (defaults to build.properties)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache NeoForge 1.21.1 SDK & Minecraft libraries
        uses: actions/cache@v4
        with:
          path: .build-cache
          key: rpgtemplate-nf21-sdk-${{ hashFiles('build.properties') }}

      - name: Build & verify NeoForge 1.21.1 JAR
        shell: bash
        run: |
          chmod +x build.sh
          EXTRA_ARGS=(--clean)
          if [[ -n "${{ github.event.inputs.mod_version }}" ]]; then
            EXTRA_ARGS+=(--version "${{ github.event.inputs.mod_version }}")
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v*-neoforge* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            VER="${VER%%-neoforge*}"
            EXTRA_ARGS+=(--version "${VER}")
          fi
          ./build.sh "${EXTRA_ARGS[@]}"
          ls -lh dist/

      - name: Upload NeoForge 1.21.1 JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpgtemplate-neoforge-1.21.1-jar
          path: dist/rpgtemplate-*-neoforge-1.21.1.jar
          if-no-files-found: error

      - name: Publish GitHub Release on NeoForge version tag
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-neoforge')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/rpgtemplate-*-neoforge-1.21.1.jar \
            --title "rpgtemplate ${GITHUB_REF_NAME}" \
            --generate-notes
