name: Build rpgtemplate NeoForge 1.21.1 JAR

on:
  push:
    branches: [neoforge-1.21.1]
    tags: ["v*-neoforge-1.21.1"]
  pull_request:
    branches: [neoforge-1.21.1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache NeoForge 1.21.1 SDK & Minecraft libraries
        uses: actions/cache@v4
        with:
          path: .build-cache
          key: rpgtemplate-nf21-sdk-${{ hashFiles('build.properties') }}

      - name: Build & verify NeoForge 1.21.1 JAR
        run: |
          chmod +x build.sh
          ./build.sh --clean

      - name: Upload NeoForge 1.21.1 JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpgtemplate-neoforge-1.21.1-jar
          path: dist/rpgtemplate-*-neoforge-1.21.1.jar
          if-no-files-found: error
